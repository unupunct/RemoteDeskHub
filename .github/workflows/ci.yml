name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RemoteDeskHub.slnx

      - name: Build
        run: dotnet build RemoteDeskHub.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test RemoteDeskHub.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Check for vulnerable packages
        run: dotnet list RemoteDeskHub.slnx package --vulnerable --include-transitive

  codeql:
    name: CodeQL
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build for CodeQL
        run: dotnet build RemoteDeskHub.slnx -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  installer-e2e:
    name: Installer E2E
    runs-on: windows-latest
    needs: build-test
    env:
      CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
      CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          & $wix extension add -g WixToolset.UI.wixext/5.0.2
          & $wix extension add -g WixToolset.Firewall.wixext/5.0.2

      - name: Prepare code signing certificate
        if: env.CODE_SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64)
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          "SIGNING_PFX_PATH=$path" >> $env:GITHUB_ENV

      - name: Build baseline installers (1.0.0)
        shell: pwsh
        run: |
          $arguments = @('-Version', '1.0.0')
          if ($env:SIGNING_PFX_PATH) {
            $arguments += @(
              '-SigningPfxPath', $env:SIGNING_PFX_PATH,
              '-SigningPfxPassword', $env:CODE_SIGNING_PFX_PASSWORD
            )
          }
          & .\scripts\build-installers.ps1 @arguments

      - name: Build upgrade installers (1.0.1)
        shell: pwsh
        run: |
          $arguments = @('-Version', '1.0.1')
          if ($env:SIGNING_PFX_PATH) {
            $arguments += @(
              '-SigningPfxPath', $env:SIGNING_PFX_PATH,
              '-SigningPfxPassword', $env:CODE_SIGNING_PFX_PASSWORD
            )
          }
          & .\scripts\build-installers.ps1 @arguments

      - name: Test install, upgrade and uninstall
        shell: pwsh
        run: |
          & .\scripts\test-installers.ps1 `
            -Version 1.0.0 `
            -UpgradeVersion 1.0.1 `
            -InstallerDir (Resolve-Path .\artifacts\installers).Path `
            -UpgradeInstallerDir (Resolve-Path .\artifacts\installers).Path

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            artifacts/installers/*.msi
            artifacts/installers/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs
          path: ${{ runner.temp }}/RemoteDeskInstallerTests-*
          if-no-files-found: ignore
